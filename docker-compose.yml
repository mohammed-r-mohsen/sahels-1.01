version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sahels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahels
      POSTGRES_USER: sahels
      POSTGRES_PASSWORD: sahels_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sahels-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
